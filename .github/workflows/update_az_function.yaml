name: Update Azure Function App Setting

on:
  workflow_run:
    workflows: ["Deploy Azure Function Infrastructure"]
    types:
      - completed

  push:
    branches:
      - dev
      - feature1
    paths:
      - '.github/workflows/update_az_function.yaml'

  workflow_dispatch:

jobs:
  update_function_app_setting:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP_NAME: healthcare_project
      FUNCTION_APP_NAME: process-file-func

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export ARM and TF_VAR environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ACR_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ACR_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ACR_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

          echo "TF_VAR_AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_ACR_CLIENT_ID=${{ secrets.ACR_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_ACR_CLIENT_SECRET=${{ secrets.ACR_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "TF_VAR_ACR_TENANT_ID=${{ secrets.ACR_TENANT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" >> $GITHUB_ENV

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: terraform/dev/infra
        run: terraform init

      - name: Get storage account name from terraform output
        id: get_storage_name
        working-directory: terraform/dev/infra
        # This command is more robust. It captures all output, filters out debug messages,,
        # and then extracts the last line, which should be the clean storage account name.
        run: |
          OUTPUT=$(terraform output storage_account_name 2>&1)
          STORAGE_ACCOUNT_NAME=$(echo "$OUTPUT" | grep -v '::debug::' | tail -n 1)
          if [ -z "$STORAGE_ACCOUNT_NAME" ]; then
            echo "Error: The 'storage_account_name' output variable is empty. This may be due to a missing or corrupt Terraform state file, or the output variable does not exist."
            echo "Please ensure the Terraform code has an output block for 'storage_account_name' and the 'terraform init' step is successful."
            exit 1
          fi
          echo "Storage account name is: $STORAGE_ACCOUNT_NAME"
          echo "storage_account_name=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT

      - name: Get storage account key
        id: get_storage_key
        run: |
          STORAGE_ACCOUNT_NAME=${{ steps.get_storage_name.outputs.storage_account_name }}
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --query '[0].value' -o tsv)
          echo "storage_key=$STORAGE_KEY" >> $GITHUB_OUTPUT

      - name: Update Azure Function App Setting STORAGE_CONN
        run: |
          STORAGE_ACCOUNT_NAME=${{ steps.get_storage_name.outputs.storage_account_name }}
          STORAGE_KEY=${{ steps.get_storage_key.outputs.storage_key }}

          STORAGE_CONN="DefaultEndpointsProtocol=https;AccountName=$STORAGE_ACCOUNT_NAME;AccountKey=$STORAGE_KEY;EndpointSuffix=core.windows.net"

          az functionapp config appsettings set \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --settings STORAGE_CONN="$STORAGE_CONN"
