name: Deploy Azure Function Infrastructure

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev]

    env:
      RESOURCE_GROUP_NAME: healthcare_project
      FUNCTION_NAME: "process-file-func"
      TRIGGER_NAME: "myTrigger1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: terraform/${{ matrix.env }}/infra
        run: terraform init

      # Core Infrastructure (without EventGrid)
      - name: Deploy Core Infrastructure
        working-directory: terraform/${{ matrix.env }}/infra
        run: |
          terraform apply -auto-approve -var-file=terraform.tfvars \
            -var="deploy_eventgrid=false" \
            -target=module.function \
            -target=module.storage \
            -target=module.log_analytics

      # Validate Function Code Structure
      - name: Validate Function Code
        working-directory: function-code
        run: |
          [ -d "${{ env.TRIGGER_NAME }}" ] || { echo "Function folder missing"; exit 1; }
          [ -f "${{ env.TRIGGER_NAME }}/function.json" ] || { echo "function.json missing"; exit 1; }

      # Deploy Function Code
      - name: Install Azure Functions Core Tools
        run: sudo npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish Function Code
        working-directory: function-code
        run: func azure functionapp publish ${{ env.FUNCTION_NAME }} --python

      # Deploy EventGrid After Function is Ready
      - name: Deploy EventGrid Integration
        working-directory: terraform/${{ matrix.env }}/infra
        run: |
          terraform apply -auto-approve -var-file=terraform.tfvars \
            -var="deploy_eventgrid=true" \
            -target=module.eventgrid \
            -target=module.servicebus

      # Verify Integration
      - name: Test Event Grid Integration
        run: |
          curl -X POST \
            "https://${{ env.FUNCTION_NAME }}.azurewebsites.net/runtime/webhooks/EventGrid?functionName=${{ env.TRIGGER_NAME }}" \
            -H "Content-Type: application/json" \
            -d '{"subject":"/blobServices/default/containers/incoming/blobs/test.csv"}'